<!doctype html>
<html>
  <head>
    <title>ski time!</title>
    <link rel="icon" href="favicon.png">
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #bfe9ff;
        font-family: Arial, sans-serif;
        overflow: hidden;
        position: relative;
      }

      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }

      .game-wrap {
        position: relative;
        width: 700px;
        max-width: 95vw;
      }

      canvas {
        width: 100%;
        height: 420px;
        display: block;
        border: 4px solid #ffffff;
        box-shadow: 6px 6px 0 #000000;
        background: linear-gradient(#dff6ff 0%, #ffffff 60%);
      }

      .hud {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #ffffff;
        padding: 6px 10px;
        font-weight: bold;
        border-radius: 6px;
        font-size: 16px;
      }

      .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        color: #003366;
        text-shadow: 2px 2px 0 #ffffff;
        pointer-events: auto;
      }

      .message a {
        color: #003366;
        text-decoration: underline;
      }

      .skip-btn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #ffffff;
        color: #003366;
        padding: 10px 16px;
        text-decoration: none;
        font-weight: bold;
        border: 2px solid #003366;
        box-shadow: 3px 3px 0 #000000;
      }

      .restart-btn {
        position: fixed;
        right: 20px;
        bottom: 70px;
        background: #ffffff;
        color: #003366;
        padding: 10px 16px;
        font-weight: bold;
        border: 2px solid #003366;
        box-shadow: 3px 3px 0 #000000;
        cursor: pointer;
      }

      .restart-btn:active {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 #000000;
      }

      .music-btn {
        position: fixed;
        left: 20px;
        bottom: 20px;
        background: #ffffff;
        color: #003366;
        padding: 10px 16px;
        font-weight: bold;
        border: 2px solid #003366;
        box-shadow: 3px 3px 0 #000000;
        cursor: pointer;
      }

      .music-btn:active {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 #000000;
      }

      .skip-btn:active {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 #000000;
      }

      .win-btn {
        display: none;
        position: absolute;
        bottom: -60px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
        background-size: 200% 200%;
        color: #ffffff;
        padding: 14px 28px;
        text-decoration: none;
        font-weight: bold;
        font-size: 18px;
        border: 3px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.6);
        animation: float 2s ease-in-out infinite, glow 1.5s ease-in-out infinite, gradientShift 3s linear infinite;
        cursor: pointer;
      }

      @keyframes float {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-10px); }
      }

      @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.6); }
        50% { box-shadow: 0 0 30px rgba(255, 0, 255, 1), 0 0 60px rgba(0, 255, 255, 0.9); }
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .game-title {
        text-align: center;
        font-size: 48px;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 
          3px 3px 0 #003366,
          0 0 20px #00ffff,
          0 0 40px #00ffff;
        margin-bottom: 20px;
        animation: titleGlow 1.5s ease-in-out infinite alternate;
      }

      @keyframes titleGlow {
        from {
          text-shadow: 
            3px 3px 0 #003366,
            0 0 20px #00ffff,
            0 0 40px #00ffff;
        }
        to {
          text-shadow: 
            3px 3px 0 #003366,
            0 0 30px #00ffff,
            0 0 60px #00ffff,
            0 0 80px #00ffff;
        }
      }
    </style>
  </head>
  <body>
    <video id="bgVideo" autoplay muted loop>
      <source src="skigif.mp4" type="video/mp4">
    </video>
    <div class="game-title">quick, ski!</div>
    <div class="game-wrap">
      <canvas id="skiCanvas" width="700" height="420"></canvas>
      <div class="hud" id="hud">Time: 15</div>
      <div class="message" id="message"></div>
      <a class="win-btn" id="winBtn" href="cave.html">See what's at the bottom of the hill</a>
    </div>

    <a class="skip-btn" href="cave.html">Skip</a>
    <button class="restart-btn" id="restartBtn" type="button">Restart</button>
    <button class="music-btn" id="musicToggle" type="button">Music: On</button>
    <audio id="skiAudio" src="toastopia.mp3" loop></audio>
    <audio id="diddyAudio" src="diddyparty.mp3"></audio>
    <audio id="failAudio" src="fail.mp3"></audio>

    <script>
      const canvas = document.getElementById('skiCanvas');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('hud');
      const message = document.getElementById('message');
      const skiAudio = document.getElementById('skiAudio');
      const diddyAudio = document.getElementById('diddyAudio');
      const failAudio = document.getElementById('failAudio');
      const musicToggle = document.getElementById('musicToggle');
      const restartBtn = document.getElementById('restartBtn');
      const winBtn = document.getElementById('winBtn');
      let musicEnabled = true;

      const game = {
        running: true,
        paused: false,
        startTime: null,
        duration: 15000,
        player: { x: canvas.width / 2, y: canvas.height - 50, w: 26, h: 26, speed: 5.5 },
        obstacles: [],
        obstacleTimer: 0,
        obstacleInterval: 600,
        keys: { left: false, right: false }
      };

      function resetGame() {
        game.running = true;
        game.paused = false;
        game.startTime = null;
        game.obstacles = [];
        game.obstacleTimer = 0;
        message.textContent = '';
      }

      function startAudio() {
        if (skiAudio && musicEnabled) {
          skiAudio.play().catch(() => {});
        }
      }

      function stopAudio() {
        if (skiAudio) {
          skiAudio.pause();
        }
      }

      const jeffyImg = new Image();
      jeffyImg.src = 'jeffy.png';
      const diddImg = new Image();
      diddImg.src = 'didd.png';

      function spawnObstacle() {
        let size = 24 + Math.random() * 22;
        const x = 10 + Math.random() * (canvas.width - size - 20);
        const speed = 2.4 + Math.random() * 2.8;
        const roll = Math.random();
        const type = roll < 1 / 3 ? 'box' : roll < 2 / 3 ? 'jeffy' : 'didd';
        if (type !== 'box') {
          size *= 1.8;
        }
        game.obstacles.push({ x, y: -size, w: size, h: size, speed, type });
      }

      function drawPlayer() {
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(game.player.x, game.player.y - 12);
        ctx.lineTo(game.player.x - 12, game.player.y + 12);
        ctx.lineTo(game.player.x + 12, game.player.y + 12);
        ctx.closePath();
        ctx.fill();
      }

      function drawObstacles() {
        game.obstacles.forEach(ob => {
          if (ob.type === 'jeffy') {
            ctx.drawImage(jeffyImg, ob.x, ob.y, ob.w, ob.h);
          } else if (ob.type === 'didd') {
            ctx.drawImage(diddImg, ob.x, ob.y, ob.w, ob.h);
          } else {
            ctx.fillStyle = '#2b5a2b';
            ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          }
        });
      }

      function updatePlayer() {
        if (game.keys.left) {
          game.player.x -= game.player.speed;
        }
        if (game.keys.right) {
          game.player.x += game.player.speed;
        }
        const minX = 12;
        const maxX = canvas.width - 12;
        game.player.x = Math.max(minX, Math.min(maxX, game.player.x));
      }

      function updateObstacles(delta) {
        game.obstacleTimer += delta;
        if (game.obstacleTimer > game.obstacleInterval) {
          spawnObstacle();
          game.obstacleTimer = 0;
        }
        game.obstacles.forEach(ob => {
          ob.y += ob.speed * (delta / 16.67);
        });
        game.obstacles = game.obstacles.filter(ob => ob.y < canvas.height + 40);
      }

      function checkCollision() {
        const p = game.player;
        return game.obstacles.find(ob => {
          return (
            p.x - p.w / 2 < ob.x + ob.w &&
            p.x + p.w / 2 > ob.x &&
            p.y - p.h / 2 < ob.y + ob.h &&
            p.y + p.h / 2 > ob.y
          );
        });
      }

      function updateHUD(remaining) {
        const seconds = Math.ceil(remaining / 1000);
        hud.textContent = `Time: ${seconds}`;
      }

      function endGame(text, link) {
        game.running = false;
        if (link) {
          message.innerHTML = `<a href="${link}">${text}</a>`;
        } else {
          message.textContent = text;
        }
      }

      let lastTime = 0;
      let pausedTime = 0;
      function loop(timestamp) {
        if (!game.startTime) {
          game.startTime = timestamp;
        }
        const delta = timestamp - lastTime;
        lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!game.paused) {
          updatePlayer();
          if (game.running) {
            updateObstacles(delta);
          }
        } else {
          pausedTime += delta;
          game.startTime += delta;
        }

        drawObstacles();
        drawPlayer();

        const elapsed = timestamp - game.startTime;
        const remaining = Math.max(0, game.duration - elapsed);
        updateHUD(remaining);

        if (game.running) {
          const hit = checkCollision();
          if (hit) {
            endGame('Ouch! You hit a tree!');
            musicEnabled = false;
            musicToggle.textContent = 'Music: Off';
            stopAudio();
            if (hit.type === 'didd' && diddyAudio) {
              diddyAudio.currentTime = 0;
              diddyAudio.play().catch(() => {});
            }
            if (hit.type === 'jeffy' && failAudio) {
              failAudio.currentTime = 0;
              failAudio.play().catch(() => {});
            }
          }
        }

        if (game.running && remaining <= 0) {
          endGame("See what's at the bottom of the hill", "cave.html");
        }

        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key === 'a') {
          game.keys.left = true;
        }
        if (event.key === 'ArrowRight' || event.key === 'd') {
          game.keys.right = true;
        }
        if (event.key === 'p' || event.key === 'P') {
          game.paused = !game.paused;
          if (game.paused) {
            message.textContent = 'PAUSED (Press P to resume)';
          } else {
            message.textContent = '';
          }
        }
        if (event.key === 'r' || event.key === 'R') {
          resetGame();
          game.startTime = null;
          game.running = true;
          message.textContent = '';
          musicEnabled = true;
          musicToggle.textContent = 'Music: On';
          startAudio();
        }
        startAudio();
      });

      window.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key === 'a') {
          game.keys.left = false;
        }
        if (event.key === 'ArrowRight' || event.key === 'd') {
          game.keys.right = false;
        }
      });

      canvas.addEventListener('mousemove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const scale = canvas.width / rect.width;
        game.player.x = x * scale;
        startAudio();
      });

      canvas.addEventListener('touchmove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const touch = event.touches[0];
        const x = touch.clientX - rect.left;
        const scale = canvas.width / rect.width;
        game.player.x = x * scale;
        startAudio();
      }, { passive: true });

      resetGame();
      startAudio();
      requestAnimationFrame(loop);

      musicToggle.addEventListener('click', () => {
        musicEnabled = !musicEnabled;
        musicToggle.textContent = musicEnabled ? 'Music: On' : 'Music: Off';
        if (musicEnabled) {
          startAudio();
        } else {
          stopAudio();
        }
      });

      restartBtn.addEventListener('click', () => {
        resetGame();
        game.startTime = null;
        game.running = true;
        message.textContent = '';
        musicEnabled = true;
        musicToggle.textContent = 'Music: On';
        startAudio();
      });
    </script>
  </body>
</html>
