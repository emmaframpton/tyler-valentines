<!DOCTYPE HTML>
<html> 
    <head>
        <title>you've got mail!</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon.png">
        <audio id="win95" src="win95.mp3" preload="auto"></audio>
        <audio id="notification" src="notification.mp3" preload="auto"></audio>
        <script>
            const win95 = document.getElementById('win95');
            const notification = document.getElementById('notification');
            
            win95.volume = 1.0;
            notification.volume = 1.0;
            
            win95.addEventListener('ended', function() {
                notification.play().catch(e => console.log('Notification failed:', e));
            });
            
            // Try to play on page load
            setTimeout(() => {
                win95.play().catch(e => {
                    console.log('Autoplay blocked, waiting for interaction');
                    // Play on first interaction
                    const playOnce = () => {
                        win95.play().catch(err => console.log('Play error:', err));
                    };
                    document.body.addEventListener('click', playOnce, { once: true });
                    document.body.addEventListener('keydown', playOnce, { once: true });
                });
            }, 100);
        </script>
    </head>
<body style="background: #008080; margin: 0; padding: 0; font-family: 'Comic Sans MS', cursive;">
    <center>
        <div style="margin-top: 50px; background: #c0c0c0; border: 3px outset #ffffff; max-width: 600px; box-shadow: 5px 5px 0px #000000;">
            <!-- Retro Taskbar -->
            <div style="background: linear-gradient(to bottom, #0000a8 0%, #0000a8 100%); padding: 5px 10px; border-bottom: 2px solid #000; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #ffffff; font-size: 16px; font-weight: bold;">💌 Valentine's Mail</span>
                <div>
                    <span style="color: #c0c0c0; font-size: 14px; margin-right: 10px;">📅 Feb 14</span>
                    <span style="background: #c0c0c0; color: #000; padding: 2px 8px; border: 1px outset #fff; font-size: 12px;">✕</span>
                </div>
            </div>
            
            <!-- Main Content -->
            <div style="padding: 20px;">
                <img src="windows95.png" width="180" height="180" alt="mailbox">
                <h2 style="color: #000080; font-size: 32px; margin: 10px 0 8px 0;">
                    YOU'VE GOT MAIL! 
                </h2>
                <p style="font-size: 18px; color: #000000; margin: 8px 0;">
                    Click below to open your special message...
                </p>
                <a href="envelope.html" style="display: inline-block; padding: 10px 20px; background: #c0c0c0; color: #000000; text-decoration: none; font-size: 18px; border: 2px outset #ffffff; font-weight: bold; box-shadow: 2px 2px 0px #000000; margin-top: 8px;">
                    Open Mailbox
                </a>
                <p style="color: #000080; font-size: 16px; margin: 12px 0 8px 0;">
                    happy valentine's day!
                </p>
            </div>
        </div>
    </center>
    
    <style>
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }
    </style>
</body>
</html>
